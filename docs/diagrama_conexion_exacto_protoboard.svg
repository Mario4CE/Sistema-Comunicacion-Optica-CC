<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="Segoe UI, Arial, sans-serif">
  <!-- Fondo estilo mesa de trabajo TinkerCAD -->
  <rect width="1280" height="780" fill="#1e3a5f"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#274975" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="780" fill="url(#grid)"/>

  <!-- Encabezado -->
  <rect x="20" y="15" width="1240" height="52" rx="8" fill="#0f233d" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="40" y="38" fill="#ffffff" font-size="18" font-weight="bold">ESQUEMA EXACTO DE MONTAJE EN PROTOBOARD / TINKERCAD (CORREGIDO AL 100% — EL2113)</text>
  <text x="40" y="57" fill="#8ec5fc" font-size="13">Cumple Req. P.17/Q.18 (Sin cable en 5V de Arduino; Fuente DC de Laboratorio), Req. E.5/F.6 (LM358 OpAmp 1A + 1B) y sin cortocircuitos de fila</text>

  <!-- ==================== 1. FUENTE DC DE LABORATORIO ==================== -->
  <rect x="35" y="85" width="250" height="145" rx="8" fill="#2c3e50" stroke="#ecf0f1" stroke-width="2"/>
  <text x="50" y="110" fill="#f1c40f" font-size="14" font-weight="bold">FUENTE DC LABORATORIO</text>
  <text x="50" y="127" fill="#bdc3c7" font-size="11">(Bodega Escuela Electrónica - Req. Q.18)</text>
  <rect x="55" y="138" width="125" height="45" rx="4" fill="#0b1911" stroke="#27ae60" stroke-width="1.5"/>
  <text x="68" y="168" fill="#2ecc71" font-family="Consolas, monospace" font-size="24" font-weight="bold">+5.00 V</text>
  <!-- Bornes de fuente -->
  <circle cx="215" cy="150" r="10" fill="#e74c3c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="202" y="135" fill="#ff7675" font-size="11" font-weight="bold">+VCC</text>
  <circle cx="255" cy="150" r="10" fill="#2d3436" stroke="#ffffff" stroke-width="1.5"/>
  <text x="242" y="135" fill="#dfe6e9" font-size="11" font-weight="bold">GND</text>

  <!-- ==================== 2. ARDUINO UNO R3 ==================== -->
  <rect x="35" y="260" width="250" height="390" rx="10" fill="#006699" stroke="#ffffff" stroke-width="2"/>
  <text x="55" y="295" fill="#ffffff" font-size="20" font-weight="bold">ARDUINO UNO R3</text>
  <text x="55" y="315" fill="#b3e5fc" font-size="12">Etapa 1: Patrón 4 Bits (Req. C.3)</text>

  <!-- Bloque Power Arduino (Izquierda/Abajo) -->
  <rect x="50" y="520" width="95" height="105" rx="4" fill="#004466" stroke="#81d4fa" stroke-width="1"/>
  <text x="58" y="540" fill="#ffeb3b" font-size="11" font-weight="bold">POWER</text>
  <!-- Pin 5V desconectado -->
  <circle cx="65" cy="565" r="5" fill="#111"/>
  <line x1="58" y1="558" x2="72" y2="572" stroke="#ff5252" stroke-width="2.5"/>
  <line x1="72" y1="558" x2="58" y2="572" stroke="#ff5252" stroke-width="2.5"/>
  <text x="77" y="569" fill="#ff8a80" font-size="11" font-weight="bold">5V (NO USAR P.17)</text>
  <!-- Pin GND conectado -->
  <circle cx="65" cy="595" r="6" fill="#000" stroke="#fff" stroke-width="1.5"/>
  <text x="77" y="599" fill="#ffffff" font-size="12" font-weight="bold">GND (Común)</text>

  <!-- Pines Digitales D8 a D11 (Derecha del Arduino) -->
  <rect x="175" y="340" width="98" height="165" rx="4" fill="#004466" stroke="#81d4fa" stroke-width="1"/>
  <text x="183" y="360" fill="#ffeb3b" font-size="11" font-weight="bold">DIGITAL (4 BITS)</text>
  <circle cx="260" cy="385" r="5" fill="#00e5ff" stroke="#fff"/>
  <text x="183" y="389" fill="#ffffff" font-size="12" font-weight="bold">D8 (b0 LSB)</text>
  <circle cx="260" cy="415" r="5" fill="#76ff03" stroke="#fff"/>
  <text x="183" y="419" fill="#ffffff" font-size="12" font-weight="bold">D9 (b1)</text>
  <circle cx="260" cy="445" r="5" fill="#ffea00" stroke="#fff"/>
  <text x="183" y="449" fill="#ffffff" font-size="12" font-weight="bold">D10 (b2)</text>
  <circle cx="260" cy="475" r="5" fill="#ff9100" stroke="#fff"/>
  <text x="183" y="479" fill="#ffffff" font-size="12" font-weight="bold">D11 (b3 MSB)</text>

  <!-- ==================== 3. PROTOBOARD (SIN CORTOCIRCUITOS DE FILA) ==================== -->
  <rect x="340" y="85" width="580" height="655" rx="10" fill="#f5f6fa" stroke="#dcdde1" stroke-width="3"/>
  <!-- Canal central divisorio del protoboard -->
  <rect x="612" y="85" width="26" height="655" fill="#dcdde1"/>
  <text x="485" y="108" fill="#2f3640" font-size="13" font-weight="bold">COLUMNAS A–E (Izquierda)</text>
  <text x="655" y="108" fill="#2f3640" font-size="13" font-weight="bold">COLUMNAS F–J (Derecha)</text>

  <!-- Rieles laterales Izquierdos (- GND y + VCC) -->
  <line x1="365" y1="115" x2="365" y2="715" stroke="#2980b9" stroke-width="4"/>
  <text x="355" y="108" fill="#2980b9" font-size="14" font-weight="bold">−</text>
  <line x1="390" y1="115" x2="390" y2="715" stroke="#e74c3c" stroke-width="4"/>
  <text x="384" y="108" fill="#e74c3c" font-size="14" font-weight="bold">+</text>

  <!-- Rieles laterales Derechos (- GND y + VCC) -->
  <line x1="875" y1="115" x2="875" y2="715" stroke="#e74c3c" stroke-width="4"/>
  <text x="870" y="108" fill="#e74c3c" font-size="14" font-weight="bold">+</text>
  <line x1="900" y1="115" x2="900" y2="715" stroke="#2980b9" stroke-width="4"/>
  <text x="895" y="108" fill="#2980b9" font-size="14" font-weight="bold">−</text>

  <!-- Explicación de Filas del Protoboard -->
  <rect x="415" y="120" width="435" height="32" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="425" y="140" fill="#856404" font-size="12" font-weight="bold">NOTA CLAVE: Cada resistencia 2R cruza el canal central (de Columna D a Columna F)</text>

  <!-- FILAS DE LA ESCALERA R-2R (Filas 5, 9, 13, 17) -->
  <!-- Fila 5: Bit 0 (LSB) -> Nodo V1 -->
  <rect x="420" y="173" width="188" height="24" rx="3" fill="#e8f4f8" stroke="#b2bec3"/>
  <rect x="642" y="173" width="210" height="24" rx="3" fill="#e8f4f8" stroke="#b2bec3"/>
  <text x="426" y="189" fill="#2d3436" font-size="12" font-weight="bold">Fila 5 (Entrada D8)</text>
  <text x="765" y="189" fill="#0984e3" font-size="12" font-weight="bold">Nodo V1 (b0)</text>

  <!-- Fila 9: Bit 1 -> Nodo V2 -->
  <rect x="420" y="233" width="188" height="24" rx="3" fill="#e8f4f8" stroke="#b2bec3"/>
  <rect x="642" y="233" width="210" height="24" rx="3" fill="#e8f4f8" stroke="#b2bec3"/>
  <text x="426" y="249" fill="#2d3436" font-size="12" font-weight="bold">Fila 9 (Entrada D9)</text>
  <text x="765" y="249" fill="#0984e3" font-size="12" font-weight="bold">Nodo V2 (b1)</text>

  <!-- Fila 13: Bit 2 -> Nodo V3 -->
  <rect x="420" y="293" width="188" height="24" rx="3" fill="#e8f4f8" stroke="#b2bec3"/>
  <rect x="642" y="293" width="210" height="24" rx="3" fill="#e8f4f8" stroke="#b2bec3"/>
  <text x="426" y="309" fill="#2d3436" font-size="12" font-weight="bold">Fila 13 (Entrada D10)</text>
  <text x="765" y="309" fill="#0984e3" font-size="12" font-weight="bold">Nodo V3 (b2)</text>

  <!-- Fila 17: Bit 3 (MSB) -> Nodo V4 (V_DAC) -->
  <rect x="420" y="353" width="188" height="24" rx="3" fill="#e8f4f8" stroke="#b2bec3"/>
  <rect x="642" y="353" width="210" height="24" rx="3" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="2"/>
  <text x="426" y="369" fill="#2d3436" font-size="12" font-weight="bold">Fila 17 (Entrada D11)</text>
  <text x="740" y="369" fill="#d35400" font-size="12" font-weight="bold">Nodo V4 (V_R2R)</text>

  <!-- RESISTENCIAS 2R (20 kOhm) CRUZANDO EL CANAL CENTRAL (Col D -> Col F) -->
  <!-- 2R Bit 0 -->
  <line x1="560" y1="185" x2="680" y2="185" stroke="#7f8c8d" stroke-width="3"/>
  <rect x="585" y="176" width="75" height="18" rx="4" fill="#d2b48c" stroke="#8b4513" stroke-width="1.5"/>
  <text x="593" y="189" fill="#000" font-size="11" font-weight="bold">2R = 20kΩ</text>

  <!-- 2R Bit 1 -->
  <line x1="560" y1="245" x2="680" y2="245" stroke="#7f8c8d" stroke-width="3"/>
  <rect x="585" y="236" width="75" height="18" rx="4" fill="#d2b48c" stroke="#8b4513" stroke-width="1.5"/>
  <text x="593" y="249" fill="#000" font-size="11" font-weight="bold">2R = 20kΩ</text>

  <!-- 2R Bit 2 -->
  <line x1="560" y1="305" x2="680" y2="305" stroke="#7f8c8d" stroke-width="3"/>
  <rect x="585" y="296" width="75" height="18" rx="4" fill="#d2b48c" stroke="#8b4513" stroke-width="1.5"/>
  <text x="593" y="309" fill="#000" font-size="11" font-weight="bold">2R = 20kΩ</text>

  <!-- 2R Bit 3 -->
  <line x1="560" y1="365" x2="680" y2="365" stroke="#7f8c8d" stroke-width="3"/>
  <rect x="585" y="356" width="75" height="18" rx="4" fill="#d2b48c" stroke="#8b4513" stroke-width="1.5"/>
  <text x="593" y="369" fill="#000" font-size="11" font-weight="bold">2R = 20kΩ</text>

  <!-- RESISTENCIA DE TERMINACION 2R (20 kOhm) ENTRE NODO V1 (Fila 5 Der) Y RIEL GND DERECHO -->
  <line x1="740" y1="185" x2="900" y2="160" stroke="#7f8c8d" stroke-width="3"/>
  <rect x="785" y="158" width="85" height="18" rx="4" fill="#d2b48c" stroke="#8b4513" stroke-width="1.5"/>
  <text x="790" y="171" fill="#000" font-size="10.5" font-weight="bold">R_term 20kΩ</text>

  <!-- 3 RESISTENCIAS R (10 kOhm) ENTRE FILAS CONSECUTIVAS EN LADO DERECHO (Columna G) -->
  <!-- R entre Fila 5 (V1) y Fila 9 (V2) -->
  <line x1="705" y1="185" x2="705" y2="245" stroke="#7f8c8d" stroke-width="3"/>
  <rect x="675" y="205" width="60" height="18" rx="4" fill="#85c1e9" stroke="#1b4f72" stroke-width="1.5"/>
  <text x="681" y="218" fill="#000" font-size="11" font-weight="bold">R = 10kΩ</text>

  <!-- R entre Fila 9 (V2) y Fila 13 (V3) -->
  <line x1="705" y1="245" x2="705" y2="305" stroke="#7f8c8d" stroke-width="3"/>
  <rect x="675" y="265" width="60" height="18" rx="4" fill="#85c1e9" stroke="#1b4f72" stroke-width="1.5"/>
  <text x="681" y="278" fill="#000" font-size="11" font-weight="bold">R = 10kΩ</text>

  <!-- R entre Fila 13 (V3) y Fila 17 (V4) -->
  <line x1="705" y1="305" x2="705" y2="365" stroke="#7f8c8d" stroke-width="3"/>
  <rect x="675" y="325" width="60" height="18" rx="4" fill="#85c1e9" stroke="#1b4f72" stroke-width="1.5"/>
  <text x="681" y="338" fill="#000" font-size="11" font-weight="bold">R = 10kΩ</text>

  <!-- ==================== 4. INTEGRADO LM358N (FILAS 22 A 25) ==================== -->
  <rect x="575" y="425" width="100" height="115" rx="4" fill="#2d3436" stroke="#000" stroke-width="2"/>
  <path d="M 615 425 A 10 10 0 0 0 635 425" fill="#636e72"/>
  <text x="595" y="478" fill="#ffffff" font-size="14" font-weight="bold">LM358N</text>
  <text x="585" y="495" fill="#dfe6e9" font-size="10">OpAmp 1A + 1B</text>

  <!-- Pines Izquierdos LM358 (1, 2, 3, 4) -->
  <text x="435" y="445" fill="#2d3436" font-size="11.5" font-weight="bold">Fila 22: Pin 1 (OUT1 DAC Activo)</text>
  <text x="435" y="472" fill="#2d3436" font-size="11.5" font-weight="bold">Fila 23: Pin 2 (IN1− puente a Pin 1)</text>
  <text x="435" y="499" fill="#d35400" font-size="11.5" font-weight="bold">Fila 24: Pin 3 (IN1+ desde Nodo V4)</text>
  <text x="435" y="526" fill="#2980b9" font-size="11.5" font-weight="bold">Fila 25: Pin 4 (GND a riel azul −)</text>

  <!-- Pines Derechos LM358 (8, 7, 6, 5) -->
  <text x="685" y="445" fill="#c0392b" font-size="11.5" font-weight="bold">Pin 8 (VCC a riel rojo +5V Lab)</text>
  <text x="685" y="472" fill="#27ae60" font-size="11.5" font-weight="bold">Pin 7 (OUT2 Salida Interfaz)</text>
  <text x="685" y="499" fill="#2d3436" font-size="11.5" font-weight="bold">Pin 6 (IN2− puente a Pin 7)</text>
  <text x="685" y="526" fill="#2d3436" font-size="11.5" font-weight="bold">Pin 5 (IN2+ desde Pin 1)</text>

  <!-- Puentes del LM358 -->
  <!-- Nodo V4 (Fila 17) a Pin 3 (Fila 24) -->
  <path d="M 730 365 C 760 395, 555 480, 575 495" fill="none" stroke="#e67e22" stroke-width="3"/>
  <!-- Puente Pin 1 a Pin 2 -->
  <path d="M 570 440 C 550 440, 550 468, 570 468" fill="none" stroke="#8e44ad" stroke-width="2.5"/>
  <!-- Puente Pin 1 a Pin 5 -->
  <path d="M 570 440 C 540 410, 710 555, 675 522" fill="none" stroke="#16a085" stroke-width="2.5" stroke-dasharray="4,2"/>
  <!-- Puente Pin 6 a Pin 7 -->
  <path d="M 680 468 C 700 468, 700 495, 680 495" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <!-- Pin 4 a GND -->
  <line x1="575" y1="530" x2="365" y2="530" stroke="#2980b9" stroke-width="2.5"/>
  <!-- Pin 8 a +VCC -->
  <line x1="675" y1="435" x2="875" y2="435" stroke="#e74c3c" stroke-width="2.5"/>

  <!-- ==================== 5. ETAPA 4: DRIVER LED ROJO (FILAS 28-30) ==================== -->
  <rect x="420" y="575" width="440" height="135" rx="6" fill="#fff5f5" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="435" y="598" fill="#c0392b" font-size="13" font-weight="bold">ETAPA 4 (GENERADOR ÓPTICO) → HACIA FIBRA POF (45 cm) Y ETAPAS 5, 6, 7</text>
  <text x="435" y="622" fill="#2d3436" font-size="12">• Pin 7 (LM358) → Resistencia R_driver = 150 Ω → Ánodo LED Rojo (650 nm) → Cátodo a riel GND (−)</text>
  <text x="435" y="644" fill="#2d3436" font-size="12">• Etapa 5 y 6 (Derecha): LDR entre Pin 7 y Pines 6/2 del NE555; R1 = 1 kΩ a +VCC; C1 = 100 nF a GND</text>
  <text x="435" y="666" fill="#2d3436" font-size="12">• Etapa 7 (Salida Audible): Pin 3 del NE555 → Condensador 10 µF → Buzzer Pasivo (+) → GND (−)</text>
  <text x="435" y="692" fill="#1e8449" font-size="12" font-weight="bold">✓ NINGUNA resistencia está conectada dentro de la misma fila de 5 huecos (cero cortocircuitos)</text>

  <!-- ==================== 6. CABLES DESDE FUENTE Y ARDUINO ==================== -->
  <!-- Fuente +VCC a riel rojo -->
  <path d="M 215 150 L 390 150" fill="none" stroke="#e74c3c" stroke-width="4"/>
  <!-- Fuente GND a riel azul -->
  <path d="M 255 150 L 365 130" fill="none" stroke="#2d3436" stroke-width="4"/>
  <!-- Puente rieles superiores a inferiores -->
  <path d="M 390 705 L 875 705" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="6,3"/>
  <path d="M 365 720 L 900 720" fill="none" stroke="#2980b9" stroke-width="3" stroke-dasharray="6,3"/>

  <!-- Arduino GND a riel azul GND -->
  <path d="M 65 595 L 65 690 L 365 690" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Cables de 4 bits D8..D11 a Filas 5, 9, 13, 17 -->
  <path d="M 260 385 C 310 385, 310 185, 420 185" fill="none" stroke="#00bcd4" stroke-width="3.5"/>
  <path d="M 260 415 C 320 415, 320 245, 420 245" fill="none" stroke="#4caf50" stroke-width="3.5"/>
  <path d="M 260 445 C 330 445, 330 305, 420 305" fill="none" stroke="#fbc02d" stroke-width="3.5"/>
  <path d="M 260 475 C 340 475, 340 365, 420 365" fill="none" stroke="#ff9800" stroke-width="3.5"/>

  <!-- ==================== 7. MULTÍMETRO DIGITAL (CONEXIÓN CORRECTA) ==================== -->
  <rect x="965" y="150" width="275" height="390" rx="14" fill="#f39c12" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="980" y="168" width="245" height="355" rx="10" fill="#2c3e50"/>
  <text x="1000" y="195" fill="#f1c40f" font-size="16" font-weight="bold">MULTÍMETRO DIGITAL</text>
  <!-- Pantalla LCD -->
  <rect x="1000" y="210" width="205" height="80" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="1030" y="263" fill="#145a32" font-family="Consolas, monospace" font-size="36" font-weight="bold">4.69 V</text>
  <text x="1012" y="283" fill="#196f3d" font-size="11" font-weight="bold">Estado 15 (1111₂) → 4.6875 V</text>

  <!-- Bornes del Multímetro -->
  <circle cx="1150" cy="465" r="14" fill="#e74c3c" stroke="#ffffff" stroke-width="2"/>
  <text x="1132" y="442" fill="#ff7675" font-size="12" font-weight="bold">V / Ω (+)</text>
  <circle cx="1050" cy="465" r="14" fill="#111111" stroke="#ffffff" stroke-width="2"/>
  <text x="1025" y="442" fill="#dfe6e9" font-size="12" font-weight="bold">COM (GND)</text>

  <!-- Punta Roja (+) al Pin 7 (Salida Interfaz) o Nodo V4 -->
  <path d="M 1150 465 C 1150 365, 920 365, 845 365" fill="none" stroke="#e74c3c" stroke-width="4"/>
  <!-- Punta Negra (-) al Riel Azul GND (¡NO al mismo nodo que la roja!) -->
  <path d="M 1050 465 C 1050 560, 930 560, 900 520" fill="none" stroke="#111111" stroke-width="4"/>

  <!-- Leyenda de correcciones respecto a la imagen anterior -->
  <rect x="965" y="565" width="275" height="175" rx="8" fill="#0f233d" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="980" y="590" fill="#2ecc71" font-size="13" font-weight="bold">ERRORES CORREGIDOS EN ESTA GUÍA:</text>
  <text x="980" y="613" fill="#ecf0f1" font-size="11.5">1. Eliminado cable de 5V de Arduino</text>
  <text x="980" y="630" fill="#8ec5fc" font-size="11">   (cumple Req. P.17 y Q.18).</text>
  <text x="980" y="652" fill="#ecf0f1" font-size="11.5">2. Resistencias 2R cruzan el canal</text>
  <text x="980" y="669" fill="#8ec5fc" font-size="11">   central (no están en corto).</text>
  <text x="980" y="691" fill="#ecf0f1" font-size="11.5">3. Pines en orden D8, D9, D10, D11.</text>
  <text x="980" y="713" fill="#ecf0f1" font-size="11.5">4. Punta negra del multímetro a GND.</text>
</svg>
