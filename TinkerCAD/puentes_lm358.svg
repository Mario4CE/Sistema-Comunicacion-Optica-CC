<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" width="100%" height="100%" style="background:#0f172a; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#eab308" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f97316" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Encabezado -->
  <rect x="25" y="20" width="800" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="50" fill="#f8fafc" font-size="20" font-weight="bold">Conexión de Puentes en el Amplificador Operacional Dual (LM358N)</text>
  <text x="45" y="72" fill="#94a3b8" font-size="13">Configuración como Seguidor de Tensión (Buffer) para el DAC y la Interfaz del LED</text>

  <!-- Fondo de la Protoboard -->
  <g transform="translate(180, 115)">
    <!-- Cuerpo protoboard -->
    <rect x="-30" y="-15" width="480" height="380" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <!-- Canal central de la protoboard -->
    <rect x="175" y="-15" width="70" height="380" fill="#e2e8f0" />
    <line x1="210" y1="-15" x2="210" y2="365" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1" />

    <!-- Agujeros de la protoboard (representación visual) -->
    <g fill="#94a3b8" opacity="0.4">
      <!-- Lado izquierdo columnas a-e -->
      <circle cx="20" cy="50" r="3"/><circle cx="50" cy="50" r="3"/><circle cx="80" cy="50" r="3"/><circle cx="110" cy="50" r="3"/><circle cx="140" cy="50" r="3"/>
      <circle cx="20" cy="120" r="3"/><circle cx="50" cy="120" r="3"/><circle cx="80" cy="120" r="3"/><circle cx="110" cy="120" r="3"/><circle cx="140" cy="120" r="3"/>
      <circle cx="20" cy="190" r="3"/><circle cx="50" cy="190" r="3"/><circle cx="80" cy="190" r="3"/><circle cx="110" cy="190" r="3"/><circle cx="140" cy="190" r="3"/>
      <circle cx="20" cy="260" r="3"/><circle cx="50" cy="260" r="3"/><circle cx="80" cy="260" r="3"/><circle cx="110" cy="260" r="3"/><circle cx="140" cy="260" r="3"/>
      <!-- Lado derecho columnas f-j -->
      <circle cx="280" cy="50" r="3"/><circle cx="310" cy="50" r="3"/><circle cx="340" cy="50" r="3"/><circle cx="370" cy="50" r="3"/><circle cx="400" cy="50" r="3"/>
      <circle cx="280" cy="120" r="3"/><circle cx="310" cy="120" r="3"/><circle cx="340" cy="120" r="3"/><circle cx="370" cy="120" r="3"/><circle cx="400" cy="120" r="3"/>
      <circle cx="280" cy="190" r="3"/><circle cx="310" cy="190" r="3"/><circle cx="340" cy="190" r="3"/><circle cx="370" cy="190" r="3"/><circle cx="400" cy="190" r="3"/>
      <circle cx="280" cy="260" r="3"/><circle cx="310" cy="260" r="3"/><circle cx="340" cy="260" r="3"/><circle cx="370" cy="260" r="3"/><circle cx="400" cy="260" r="3"/>
    </g>

    <!-- Chip LM358N (DIP-8) -->
    <rect x="155" y="20" width="110" height="270" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
    <!-- Muesca (Notch) que indica el Pin 1 -->
    <path d="M 195,20 A 15,15 0 0,0 225,20 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="175" cy="40" r="4" fill="#475569" /> <!-- Punto indicador pin 1 -->

    <text x="210" y="160" fill="#94a3b8" font-size="15" font-family="monospace" font-weight="bold" text-anchor="middle" transform="rotate(-90, 210, 160)">LM358N</text>

    <!-- Patillas metálicas (Pines 1 a 8) -->
    <!-- Pines izquierdos: 1, 2, 3, 4 -->
    <rect x="135" y="42" width="20" height="16" fill="#94a3b8" rx="2" />
    <rect x="135" y="112" width="20" height="16" fill="#94a3b8" rx="2" />
    <rect x="135" y="182" width="20" height="16" fill="#94a3b8" rx="2" />
    <rect x="135" y="252" width="20" height="16" fill="#94a3b8" rx="2" />

    <!-- Pines derechos: 8, 7, 6, 5 -->
    <rect x="265" y="42" width="20" height="16" fill="#94a3b8" rx="2" />
    <rect x="265" y="112" width="20" height="16" fill="#94a3b8" rx="2" />
    <rect x="265" y="182" width="20" height="16" fill="#94a3b8" rx="2" />
    <rect x="265" y="252" width="20" height="16" fill="#94a3b8" rx="2" />

    <!-- Etiquetas de números de Pin dentro del chip -->
    <text x="175" y="55" fill="#f8fafc" font-size="13" font-weight="bold">1</text>
    <text x="175" y="125" fill="#f8fafc" font-size="13" font-weight="bold">2</text>
    <text x="175" y="195" fill="#f8fafc" font-size="13" font-weight="bold">3</text>
    <text x="175" y="265" fill="#f8fafc" font-size="13" font-weight="bold">4</text>

    <text x="240" y="55" fill="#f8fafc" font-size="13" font-weight="bold">8</text>
    <text x="240" y="115" fill="#f8fafc" font-size="13" font-weight="bold">7</text>
    <text x="240" y="185" fill="#f8fafc" font-size="13" font-weight="bold">6</text>
    <text x="240" y="255" fill="#f8fafc" font-size="13" font-weight="bold">5</text>

    <!-- =================================================================== -->
    <!-- PUENTES OBLIGATORIOS (LOS QUE PREGUNTA EL USUARIO)                  -->
    <!-- =================================================================== -->

    <!-- PUENTE 1: PIN 1 CON PIN 2 (Amarillo fluorescente) -->
    <!-- Curva que une pin 1 (x=135, y=50) con pin 2 (x=135, y=120) -->
    <path d="M 135,50 C 70,50 70,120 135,120" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" filter="url(#glow-yellow)" />
    <path d="M 135,50 C 70,50 70,120 135,120" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="135" cy="50" r="5" fill="#ca8a04" />
    <circle cx="135" cy="120" r="5" fill="#ca8a04" />

    <!-- PUENTE 2: PIN 6 CON PIN 7 (Naranja fluorescente) -->
    <!-- Curva que une pin 7 (x=285, y=120) con pin 6 (x=285, y=190) -->
    <path d="M 285,120 C 350,120 350,190 285,190" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" filter="url(#glow-orange)" />
    <path d="M 285,120 C 350,120 350,190 285,190" fill="none" stroke="#ffedd5" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="285" cy="120" r="5" fill="#ea580c" />
    <circle cx="285" cy="190" r="5" fill="#ea580c" />

    <!-- PUENTE 3: CONEXIÓN ETAPA 2 A ETAPA 3 (PIN 1 A PIN 5) (Azul celeste) -->
    <path d="M 135,50 C 30,50 30,320 210,320 C 285,320 285,290 285,260" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" stroke-dasharray="6,3" filter="url(#glow-blue)" />
    <path d="M 135,50 C 30,50 30,320 210,320 C 285,320 285,290 285,260" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
    <circle cx="285" cy="260" r="5" fill="#0284c7" />

    <!-- Alimentación: Pin 8 a VCC y Pin 4 a GND -->
    <line x1="285" y1="50" x2="380" y2="50" stroke="#ef4444" stroke-width="3.5" />
    <text x="390" y="55" fill="#ef4444" font-size="12" font-weight="bold">+VCC (Pin 8)</text>

    <line x1="135" y1="260" x2="40" y2="260" stroke="#3b82f6" stroke-width="3.5" />
    <text x="-3" y="265" fill="#3b82f6" font-size="12" font-weight="bold">GND (Pin 4)</text>

    <!-- Entrada del DAC al Pin 3 -->
    <line x1="135" y1="190" x2="40" y2="190" stroke="#10b981" stroke-width="3.5" />
    <text x="-25" y="195" fill="#10b981" font-size="12" font-weight="bold">Entrada DAC (V4)</text>

    <!-- Salida hacia Resistencia del LED desde Pin 7 -->
    <line x1="285" y1="120" x2="380" y2="120" stroke="#ec4899" stroke-width="3.5" />
    <text x="390" y="125" fill="#ec4899" font-size="12" font-weight="bold">Salida al LED (150Ω)</text>
  </g>

  <!-- Tarjetas explicativas inferiores -->
  <g transform="translate(25, 495)">
    <!-- Tarjeta Puente 1 -->
    <rect x="0" y="0" width="255" height="100" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
    <text x="14" y="24" fill="#facc15" font-size="13" font-weight="bold">1. PUENTE 1: Pin 1 &lt;--&gt; Pin 2</text>
    <text x="14" y="44" fill="#e2e8f0" font-size="11">Une la <strong style="fill:#fff">Salida 1</strong> con la <strong style="fill:#fff">Entrada Inversora 1</strong>.</text>
    <text x="14" y="62" fill="#94a3b8" font-size="11">Crea el buffer de ganancia 1 (Av = 1)</text>
    <text x="14" y="78" fill="#94a3b8" font-size="11">para el DAC R-2R (Etapa 2).</text>

    <!-- Tarjeta Puente 2 -->
    <rect x="272" y="0" width="255" height="100" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <text x="286" y="24" fill="#fb923c" font-size="13" font-weight="bold">2. PUENTE 2: Pin 6 &lt;--&gt; Pin 7</text>
    <text x="286" y="44" fill="#e2e8f0" font-size="11">Une la <strong style="fill:#fff">Entrada Inversora 2</strong> con la <strong style="fill:#fff">Salida 2</strong>.</text>
    <text x="286" y="62" fill="#94a3b8" font-size="11">Crea el buffer de aislamiento (Av = 1)</text>
    <text x="286" y="78" fill="#94a3b8" font-size="11">hacia el LED emisor (Etapa 3).</text>

    <!-- Tarjeta Interconexión Pin 1 a Pin 5 -->
    <rect x="545" y="0" width="255" height="100" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="559" y="24" fill="#38bdf8" font-size="13" font-weight="bold">3. CABLE EN U: Pin 1 &lt;--&gt; Pin 5</text>
    <text x="559" y="44" fill="#e2e8f0" font-size="11">Lleva la señal analógica del OpAmp 1A</text>
    <text x="559" y="62" fill="#94a3b8" font-size="11">a la entrada no inversora del OpAmp 1B</text>
    <text x="559" y="78" fill="#94a3b8" font-size="11">(conecta Etapa 2 con Etapa 3).</text>
  </g>
</svg>
